name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # رابط تنزيل مباشر لملف الموديل بصيغة GGUF (Qwen2.5-Coder 1.5B، مقيّس Q4_K_M، ~1 جيجا)
  # لو بدك موديل مختلف، بس بدّل هاد الرابط برابط resolve/main/....gguf من Hugging Face
  MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
  # لازم يطابق قيمة modelFileName بملف MainActivity.kt
  MODEL_FILENAME: "qwen-model.gguf"

jobs:
  build:
    runs-on: ubuntu-latest
    # أول بناء بيستغرق وقت أطول (ترجمة llama.cpp + تنزيل الموديل)
    timeout-minutes: 60

    steps:
      - name: Checkout repo (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download GGUF model and place it in app assets
        run: |
          mkdir -p app/src/main/assets
          curl -L "$MODEL_URL" -o "app/src/main/assets/$MODEL_FILENAME"
          ls -lh app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Build debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6
          arguments: assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
