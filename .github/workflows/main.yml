name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
  MODEL_FILENAME: "qwen-model.gguf"
  # نسخة llama.cpp المستخدمة (تاغ ثابت بدل "master" عشان البناء ما ينكسر فجأة لو تغيّرت الـ API)
  LLAMA_CPP_TAG: "b4753"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # بنسحب llama.cpp مباشرة بأمر git clone بدل الاعتماد على git submodule
      # (أبسط وأضمن، وما بيحتاج أي إعداد إضافي من المستخدم)
      - name: Clone llama.cpp source
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          ls app/src/main/cpp/llama.cpp | head -20

      - name: Download GGUF model and place it in app assets
        run: |
          mkdir -p app/src/main/assets
          curl -L "$MODEL_URL" -o "app/src/main/assets/$MODEL_FILENAME"
          ls -lh app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Build debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.6
          arguments: assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
